services:
  # FastAPI Backend Service
  - type: web
    name: finreview-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: finreview-db
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: finreview-db
    databaseName: finreview
    user: finuser
    plan: free
